<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380">
  <defs>
    <!-- R gradient: left teal to right blue -->
    <linearGradient id="gradR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4dd6d0"/>
      <stop offset="60%" stop-color="#3a9fd6"/>
      <stop offset="100%" stop-color="#2b6cb0"/>
    </linearGradient>
    <!-- Z gradient: left blue to right teal -->
    <linearGradient id="gradZ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b6cb0"/>
      <stop offset="50%" stop-color="#3a9fd6"/>
      <stop offset="100%" stop-color="#4dd6d0"/>
    </linearGradient>
    <!-- Equalizer bars gradient -->
    <linearGradient id="gradEQ" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4dd6d0"/>
      <stop offset="100%" stop-color="#3a9fd6"/>
    </linearGradient>
    <!-- Production text gradient -->
    <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4dd6d0"/>
      <stop offset="100%" stop-color="#2b6cb0"/>
    </linearGradient>
  </defs>

  <!-- White background -->
  <rect width="520" height="380" fill="white"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Letter R (left) -->
  <!-- ═══════════════════════════════════════════ -->
  <!-- R vertical stroke -->
  <rect x="30" y="30" width="62" height="250" rx="6" fill="url(#gradR)"/>
  <!-- R top bump (half circle / arch) -->
  <path d="M90 30 Q210 30 210 95 Q210 160 90 165 L90 30 Z" fill="url(#gradR)"/>
  <!-- R bump hole (cutout to make it hollow) -->
  <path d="M100 50 Q175 50 175 95 Q175 140 100 145 Z" fill="white"/>
  <!-- R leg diagonal -->
  <path d="M92 160 L195 280 L155 280 L52 160 Z" fill="url(#gradR)"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Equalizer Bars (center, replacing I) -->
  <!-- ═══════════════════════════════════════════ -->
  <!-- Bar 1 - tallest -->
  <rect x="222" y="30"  width="18" height="250" rx="4" fill="url(#gradEQ)"/>
  <!-- Bar 2 -->
  <rect x="246" y="55"  width="18" height="225" rx="4" fill="url(#gradEQ)"/>
  <!-- Bar 3 -->
  <rect x="270" y="30"  width="18" height="250" rx="4" fill="url(#gradEQ)"/>
  <!-- Small separated blocks (bottom) -->
  <rect x="222" y="290" width="18" height="18"  rx="3" fill="url(#gradEQ)" opacity="0.6"/>
  <rect x="246" y="290" width="18" height="18"  rx="3" fill="url(#gradEQ)" opacity="0.6"/>
  <rect x="270" y="290" width="18" height="18"  rx="3" fill="url(#gradEQ)" opacity="0.6"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- Letter Z (right) -->
  <!-- ═══════════════════════════════════════════ -->
  <!-- Z top horizontal bar -->
  <rect x="300" y="30"  width="190" height="62"  rx="8" fill="url(#gradZ)"/>
  <!-- Z diagonal stroke (thick) -->
  <path d="M460 30 L300 280 L300 218 L440 92 L490 92 Z" fill="url(#gradZ)"/>
  <!-- Z bottom horizontal bar -->
  <rect x="300" y="218" width="190" height="62"  rx="8" fill="url(#gradZ)"/>

  <!-- ═══════════════════════════════════════════ -->
  <!-- "Production" text -->
  <!-- ═══════════════════════════════════════════ -->
  <text
    x="260"
    y="360"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-weight="700"
    font-size="56"
    fill="url(#gradText)"
    text-anchor="middle"
    letter-spacing="2">Production</text>
</svg>
