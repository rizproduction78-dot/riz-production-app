<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RIZ-PROLOG" />
    <meta name="application-name" content="RIZ-PROLOG" />
    <meta name="description" content="Sistem Operasional, Quality Control, Maintenance & Logistik PT. Riz Production Multi Kreasi" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>RIZ-PRO LOG — Sistem Operasional & QC</title>
    <script>
      // Tangkap event beforeinstallprompt tanpa memblokir banner native "Tambahkan ke Layar Utama"
      // agar ponsel/tablet Android & iOS selalu dapat menampilkan dan memasang aplikasi ke Layar Utama.
      (function() {
        try {
          window.__rizDeferredPwaPrompt = null;
          window.addEventListener('beforeinstallprompt', function(e) {
            window.__rizDeferredPwaPrompt = e;
            try {
              window.dispatchEvent(new CustomEvent('riz-pwa-prompt-ready', { detail: e }));
            } catch (_err) {}
          });
          window.addEventListener('appinstalled', function() {
            window.__rizDeferredPwaPrompt = null;
            try {
              window.dispatchEvent(new CustomEvent('riz-pwa-installed'));
            } catch (_err) {}
          });

          // Bersihkan Cache Storage lama agar bundle selalu terbaru
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var j = 0; j < names.length; j++) {
                caches.delete(names[j]);
              }
            });
          }

          // Registrasi Service Worker Network-First (/sw.js) untuk syarat mutlak install PWA / WebAPK di Android & Desktop
          if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
              navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(function(reg) {
                reg.update().catch(function() {});
              }).catch(function() {});
            });
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
